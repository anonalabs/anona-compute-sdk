name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anona-labs/compute-sdk lint
      - run: pnpm --filter @anona-labs/compute-sdk test
      - run: pnpm --filter @anona-labs/compute-sdk build
      - name: examples type-check against the SDK
        run: pnpm --filter anona-compute-examples typecheck

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # hatch-vcs reads the tag history
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade "pip==25.3"
      - run: pip install -e "sdk/python[test]"
      - run: python -m pytest sdk/python/tests -q
      - name: examples compile
        run: python -m py_compile examples/python/*.py

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofmt
        working-directory: cli
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "gofmt needed:"; echo "$out"; exit 1; }
      - run: go vet ./...
        working-directory: cli
      - run: go test ./...
        working-directory: cli
      - name: build every release target and check the version in each
        working-directory: cli
        # The same script cli-publish runs; 0.0.0 is a placeholder version.
        run: scripts/release.sh 0.0.0
