name: sdk-publish

# Publishes the two SDK packages, which no workflow published before:
#
#   sdk/typescript  @anona-labs/compute-sdk  -> npm
#   sdk/python      anona-compute            -> PyPI
#
# This is NOT the CLI. The `anona-compute` command-line tool is the npm package
# @anona-labs/anona-compute, built and published separately; the PyPI package
# anona-compute here is the Python library only.
#
# The version is one input used for both, and the Python package takes it from
# the sdk-v<version> tag this workflow pushes (pyproject.toml, tool.hatch.version
# matches sdk-v*), so the tag, the wheel and the npm package cannot disagree. The
# tag is pushed BEFORE either publish: a tag with nothing published is harmless
# and can be deleted, while a publish with no tag cannot be undone, because npm
# and PyPI both refuse to reuse a version even after a delete.
#
# WHY FOUR JOBS. A publishing credential must never be present in a job that
# runs other people's code. `pnpm install` and `pip install` execute package
# build and lifecycle scripts from the dependency tree, and the test suites run
# the repository's own code; any of that, in a job holding NPM_TOKEN or an OIDC
# identity, can read the credential out of the environment and publish whatever
# it likes under our name. So:
#
#   build  installs, tests and builds. No credentials, contents: read, and the
#          checkout keeps no git token. Uploads exactly what gets published.
#   tag    pushes sdk-v<version>. contents: write, no dependencies installed.
#   npm    publishes the built tarball. Never runs install or a package script.
#   pypi   publishes the built wheels. id-token only, no npm token, no write.
#
# WHAT THIS WORKFLOW CANNOT ENFORCE, and someone must set in the repository
# settings before the first real run (the ref guard below is a backstop, not a
# substitute):
#
#   * sdk-release environment: required reviewers, and a deployment branch
#     policy limited to main. Without it anyone who can dispatch a workflow can
#     run this from any branch, and workflow_dispatch takes the branch it is
#     dispatched from - including the build scripts on it.
#   * Tag protection (or a ruleset) for sdk-v*.
#   * NPM_TOKEN as an ENVIRONMENT secret on sdk-release, scoped to this package,
#     not a repository-wide secret. Better still, npm trusted publishing bound
#     to this workflow, which removes the token.
#   * The PyPI trusted publisher bound to the sdk-release environment, not just
#     to the repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, X.Y.Z. Used for both SDKs and for the sdk-v<version> tag."
        required: true
      dry_run:
        description: "Build and check only: no tag, no publish. Run this first."
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "version must look like X.Y.Z, got: $VERSION"
            exit 1
          }

      - name: refuse a version that is already published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Both registries refuse to reuse a version, so finding out here is
          # cheaper than finding out halfway through, with one of the two live.
          npm_code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@anona-labs%2Fcompute-sdk/$VERSION")
          pypi_code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/anona-compute/$VERSION/json")
          [ "$npm_code" = 404 ] || { echo "@anona-labs/compute-sdk@$VERSION already on npm (HTTP $npm_code)"; exit 1; }
          [ "$pypi_code" = 404 ] || { echo "anona-compute $VERSION already on PyPI (HTTP $pypi_code)"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # hatch-vcs reads the tag history
          persist-credentials: false # nothing here should be able to push

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: install and check
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @anona-labs/compute-sdk lint
          pnpm --filter @anona-labs/compute-sdk test
          # Pinned, like every other tool this repository installs. twine 6.2.0
          # bundles a packaging too old for the Metadata-Version 2.5 that
          # hatchling 1.32.4 writes, and rejects our own wheel with
          # "'2.5' is not a valid metadata version"; twine 7 requires
          # packaging>=26.1, which knows it.
          python -m pip install --upgrade "pip==25.3" "build==1.3.0" "twine==7.0.0" "packaging==26.3"
          pip install -e "sdk/python[test]"
          python -m pytest sdk/python/tests -q

      - name: build both packages
        env:
          VERSION: ${{ inputs.version }}
          # hatch-vcs takes the Python version from the sdk-v tag, and that tag
          # is pushed by a LATER job - it has to be, so that a failed build
          # leaves no tag behind. Without this the wheel built here would be
          # 0.0.1.dev<n>+g<sha> on a real run, not the version asked for.
          # setuptools-scm, which hatch-vcs wraps, reads this and uses it as-is.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: |
          (cd sdk/typescript && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          pnpm --filter @anona-labs/compute-sdk build
          [ -f sdk/typescript/dist/index.js ] || { echo "no dist/index.js"; exit 1; }
          # Pack now, in the job that is allowed to run scripts, so the
          # publishing job only has to upload a finished tarball.
          # --pack-destination does not create the directory; npm fails with
          # ENOENT on the tarball it is about to write if it is missing.
          mkdir -p "$GITHUB_WORKSPACE/dist/npm"
          (cd sdk/typescript && npm pack --pack-destination "$GITHUB_WORKSPACE/dist/npm")
          python -m build --outdir dist/sdk sdk/python
          python -m twine check dist/sdk/*

      - name: the built artifacts carry the version asked for
        env:
          VERSION: ${{ inputs.version }}
        run: |
          got=$(node -p "require('./sdk/typescript/package.json').version")
          [ "$got" = "$VERSION" ] || { echo "npm package says $got, expected $VERSION"; exit 1; }
          ls "dist/npm" | grep -q "$VERSION.tgz" || { echo "npm tarball is not $VERSION:"; ls dist/npm; exit 1; }
          # Checked on every run, dry included: SETUPTOOLS_SCM_PRETEND_VERSION
          # above makes the wheel carry the asked-for version whether or not the
          # tag exists yet, so a dry run now proves what a real run will build.
          ls dist/sdk | grep -q "anona_compute-$VERSION-" || {
            echo "wheel is not version $VERSION:"; ls dist/sdk; exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-dist
          path: |
            dist/npm
            dist/sdk
          if-no-files-found: error

  tag:
    needs: build
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: sdk-release
    permissions:
      contents: write # the only thing this job does
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The idempotency check below reads refs/tags, and a default checkout
          # fetches none of them: it saw no tag, created one, and the push was
          # rejected because the tag was already on the remote.
          fetch-depth: 0
          fetch-tags: true
      - name: tag sdk-v${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # An annotated tag records a tagger, and the runner has no git identity,
          # so `git tag -a` dies with "empty ident name". The tag is still
          # annotated rather than lightweight: it is what hatch-vcs reads and what
          # a human looks at later, so it should carry a date and a message.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Before publishing: an unused tag is deletable, a published version is not.
          #
          # Idempotent, because that ordering means a publish failure leaves the
          # tag behind and the fix is to run this workflow again. Re-tagging the
          # same commit is a no-op; a tag pointing somewhere else is a real
          # conflict and still stops the run.
          want="$(git rev-parse HEAD)"
          if existing="$(git rev-parse -q --verify "refs/tags/sdk-v$VERSION^{commit}")"; then
            [ "$existing" = "$want" ] || {
              echo "sdk-v$VERSION already exists and points at $existing, not $want" >&2
              exit 1
            }
            echo "sdk-v$VERSION already points at $want; nothing to do"
          else
            git tag -a "sdk-v$VERSION" -m "SDK $VERSION"
            git push origin "sdk-v$VERSION"
          fi

  npm:
    needs: tag
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: sdk-release
    permissions:
      id-token: write # npm provenance; NOT used for PyPI, which is its own job
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: publish the tarball built above
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # No checkout, no install, no package scripts: this job publishes a file
        # and never executes anything out of the dependency tree.
        #
        # ./npm/, not npm/: npm reads a bare "npm/anona-labs-compute-sdk-0.1.0.tgz"
        # as the git shorthand <owner>/<repo> and tried to clone
        # ssh://git@github.com/npm/anona-labs-compute-sdk-0.1.0.tgz.git. A leading
        # ./ makes it unambiguously a path.
        run: |
          ls -l ./npm
          # --provenance links the package to this public repository and
          # workflow run (npm issues it only for public repositories).
          npm publish --access public --provenance --ignore-scripts ./npm/*.tgz

  pypi:
    needs: tag
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: sdk-release
    permissions:
      id-token: write # PyPI trusted publishing, and nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk
          # PEP 740 attestations (on by default in this action), signed into
          # Sigstore's public log: this repository is public, so they name nothing
          # that is not already public.
          attestations: true
